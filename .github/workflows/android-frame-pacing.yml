name: Measure Android race frame pacing

on:
  pull_request:
    branches: [woodworks-race-flow]
    paths:
      - .github/workflows/android-frame-pacing.yml
      - tests/android_frame_pacing_capture.gd

permissions:
  contents: read

jobs:
  android-frame-pacing:
    if: github.head_ref == 'qa/android-frame-pacing-183'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build instrumented x86_64 APK from Marble Race 1.83
        shell: bash
        run: |
          set -euo pipefail
          version=4.5.1-stable
          root="https://github.com/godotengine/godot/releases/download/$version"
          curl -fsSL --retry 3 -o godot.zip "$root/Godot_v${version}_linux.x86_64.zip"
          curl -fsSL --retry 3 -o godot.tpz "$root/Godot_v${version}_export_templates.tpz"
          unzip -q godot.zip
          template_dir="$HOME/.local/share/godot/export_templates/4.5.1.stable"
          mkdir -p "$template_dir" "$HOME/.local/share/godot/keystores" "$HOME/.config/godot" build capture
          unzip -p godot.tpz templates/android_debug.apk > "$template_dir/android_debug.apk"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0" "platforms;android-35" "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64"
          keystore="$HOME/.local/share/godot/keystores/debug.keystore"
          if [[ ! -f "$keystore" ]]; then
            keytool -genkeypair -noprompt -keystore "$keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Open Source,C=US"
          fi
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          python - <<'PY'
          from pathlib import Path

          preset = Path("export_presets.cfg")
          debug, play = preset.read_text().split("[preset.1]", 1)
          assert "architectures/x86_64=false" in debug
          debug = debug.replace("architectures/arm64-v8a=true", "architectures/arm64-v8a=false")
          debug = debug.replace("architectures/x86_64=false", "architectures/x86_64=true")
          preset.write_text(debug + "[preset.1]" + play)

          scene = Path("scenes/main.tscn")
          text = scene.read_text().replace("load_steps=2", "load_steps=3", 1)
          resource = '[ext_resource type="Script" path="res://tests/android_frame_pacing_capture.gd" id="2"]'
          text = text.replace('[node name="MarbleRace"', resource + '\n\n[node name="MarbleRace"', 1)
          text += '\n[node name="AndroidFramePacingCapture" type="Node" parent="."]\nscript = ExtResource("2")\n'
          scene.write_text(text)
          PY
          godot="./Godot_v${version}_linux.x86_64"
          "$godot" --headless --editor --path . --import 2>&1 | tee capture/import.log
          if grep -Eq 'SCRIPT ERROR|Parse Error' capture/import.log; then exit 1; fi
          "$godot" --headless --path . --export-debug Android build/marble-race-qa.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify build/marble-race-qa.apk
          unzip -Z1 build/marble-race-qa.apk | grep -Fx 'lib/x86_64/libgodot_android.so'
      - name: Run Balanced and Economy races on Android
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chown "$USER" /dev/kvm
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name marble_qa --package "system-images;android-34;google_apis;x86_64" --device "pixel_6" <<< no
          "$ANDROID_HOME/emulator/emulator" -avd marble_qa -no-window -no-boot-anim -no-audio -no-snapshot -gpu swiftshader -memory 3072 -cores 4 > capture/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 220s adb wait-for-device
          for _ in $(seq 1 110); do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then break; fi
            kill -0 "$emulator_pid"
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb shell wm size 720x1280
          adb shell wm density 280
          adb shell wm size
          adb shell getprop ro.build.version.sdk
          adb install build/marble-race-qa.apk
          adb logcat -c
          adb logcat -v brief > capture/logcat.txt &
          log_pid=$!
          trap 'kill "$log_pid" "$emulator_pid" 2>/dev/null || true' EXIT
          adb shell monkey -p com.dbrckk.marble_race -c android.intent.category.LAUNCHER 1
          for _ in $(seq 1 106); do
            if grep -Fq MARBLE_BENCH_COMPLETE capture/logcat.txt; then break; fi
            if grep -Fq MARBLE_BENCH_FAILURE capture/logcat.txt; then break; fi
            sleep 5
          done
          adb exec-out screencap -p > capture/results.png || true
          grep -F MARBLE_BENCH_ capture/logcat.txt | tee capture/measurements.txt
          grep -Fq MARBLE_BENCH_COMPLETE capture/measurements.txt
          test "$(grep -c 'MARBLE_BENCH_REPORT ' capture/measurements.txt)" = 2
      - name: Archive measurements and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marble-race-android-emulator-frame-pacing
          path: capture/
          retention-days: 14
          if-no-files-found: warn
