name: Verify and build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Editing several files should not spend minutes signing/building obsolete
# commits. Keep only the latest run per branch or pull request.
concurrency:
  group: marble-race-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Get Godot 4.5.1 editor and Android export template
        shell: bash
        run: |
          set -euo pipefail
          VERSION=4.5.1-stable
          ROOT="https://github.com/godotengine/godot/releases/download/$VERSION"
          curl -fL --retry 3 -o godot.zip "$ROOT/Godot_v${VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v${VERSION}_linux.x86_64
          curl -fL --retry 3 -o godot.tpz "$ROOT/Godot_v${VERSION}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          # The optional stable-signed release and its CI test need the
          # separate release export template; a debug template cannot sign it.
          unzip -q godot.tpz 'templates/android_debug.apk' 'templates/android_release.apk'
          mv templates/android_debug.apk templates/android_release.apk \
            "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Import project assets
        run: ./Godot_v4.5.1-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Adaptive Android graphics regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script res://tests/adaptive_graphics.gd 2>&1 | tee adaptive-graphics.log
          grep -Fq "ADAPTIVE_GRAPHICS_PASS:" adaptive-graphics.log
      - name: Bounded Android frame telemetry and 40-marble spatial broad-phase
        shell: bash
        run: |
          set -euo pipefail
          timeout 95s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 750 --path . --script res://tests/performance_budget.gd 2>&1 | tee performance-budget.log
          grep -Fq "PERFORMANCE_BUDGET_PASS:" performance-budget.log
      - name: Nine layered 3D biome landscapes, safe shortcut clearance and economical mobile LOD
        shell: bash
        run: |
          set -euo pipefail
          timeout 110s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 1400 --path . --script res://tests/world_depth.gd 2>&1 | tee world-depth.log
          grep -Fq "WORLD_DEPTH_PASS:" world-depth.log
      - name: Smoke tests
        shell: bash
        run: |
          set -euo pipefail
          # A GDScript assert can halt the test coroutine without exiting SceneTree.
          # Force a bounded run and require the actual completion marker.
          timeout 75s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 240 --path . --script res://tests/smoke.gd 2>&1 | tee smoke.log
          grep -Fq "SMOKE_PASS:" smoke.log
      - name: Real Android neutral-drift steering and nine-layout physics authority
        shell: bash
