name: Verify and build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Get Godot 4.5.1 editor and Android export template
        shell: bash
        run: |
          set -euo pipefail
          VERSION=4.5.1-stable
          ROOT="https://github.com/godotengine/godot/releases/download/$VERSION"
          curl -fL --retry 3 -o godot.zip "$ROOT/Godot_v${VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v${VERSION}_linux.x86_64
          curl -fL --retry 3 -o godot.tpz "$ROOT/Godot_v${VERSION}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          unzip -q godot.tpz 'templates/android_debug.apk'
          mv templates/android_debug.apk "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Import project assets
        run: ./Godot_v4.5.1-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Adaptive Android graphics regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script res://tests/adaptive_graphics.gd 2>&1 | tee adaptive-graphics.log
          grep -Fq "ADAPTIVE_GRAPHICS_PASS:" adaptive-graphics.log
      - name: Smoke tests
        shell: bash
        run: |
          set -euo pipefail
          # A GDScript assert can halt the test coroutine without exiting SceneTree.
          # Force a bounded run and require the actual completion marker.
          timeout 75s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 240 --path . --script res://tests/smoke.gd 2>&1 | tee smoke.log
          grep -Fq "SMOKE_PASS:" smoke.log
      - name: Multi-touch controls regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 75s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 240 --path . --script res://tests/touch_controls.gd 2>&1 | tee touch-controls.log
          grep -Fq "TOUCH_CONTROLS_PASS:" touch-controls.log
      - name: Four-race replay and hazard UI regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script res://tests/replay_variation.gd 2>&1 | tee replay-variation.log
          grep -Fq "VARIATION_AND_HAZARD_PASS:" replay-variation.log
      - name: HUD polish and particle budgets
        shell: bash
        run: |
          set -euo pipefail
          timeout 80s ./Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script res://tests/visual_polish.gd 2>&1 | tee visual-polish.log
          grep -Fq "POLISH_PASS:" visual-polish.log
      - name: Android pause and app-background regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 320 --path . --script res://tests/pause_lifecycle.gd 2>&1 | tee pause-lifecycle.log
          grep -Fq "PAUSE_LIFECYCLE_PASS:" pause-lifecycle.log
      - name: Secure Internet protocol validation
        shell: bash
        run: |
          set -euo pipefail
          timeout 35s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 200 --path . --script res://tests/internet_validation.gd 2>&1 | tee internet-validation.log
          grep -Fq "INTERNET_VALIDATION_PASS:" internet-validation.log
      - name: Dedicated server and two clients real WebSocket integration
        shell: bash
        run: |
          set -euo pipefail
          GODOT_BIN="$PWD/Godot_v4.5.1-stable_linux.x86_64" GAME_DIR="$PWD" NETWORK_LOG_DIR="$RUNNER_TEMP/world-race" timeout 80s bash server/online_integration.sh 2>&1 | tee worldwide-e2e.log
          grep -Fq "WORLDWIDE_PROTOCOL_E2E_PASS:" worldwide-e2e.log
      - name: Internet packet freshness and ping regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 80s ./Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script res://tests/network_qos.gd 2>&1 | tee network-qos.log
          grep -Fq "NETWORK_QOS_PASS:" network-qos.log
      - name: Predictive camera, realistic contact feedback and obstacle ETA
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 520 --path . --script res://tests/race_feedback.gd 2>&1 | tee race-feedback.log
          grep -Fq "RACE_FEEL_PASS:" race-feedback.log
      - name: Verified overtakes, final sprint and nonblocking Android speed cues
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 650 --path . --script res://tests/race_moments.gd 2>&1 | tee race-moments.log
          grep -Fq "RACE_MOMENTS_PASS:" race-moments.log
      - name: Three worlds and human-only arcade pickups regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 480 --path . --script res://tests/arcade_items.gd 2>&1 | tee arcade-items.log
          grep -Fq "ARCADE_ITEMS_AND_WORLDS_PASS:" arcade-items.log
      - name: Continuous winding ground, guard seams and AI path regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 520 --path . --script res://tests/winding_tracks.gd 2>&1 | tee winding-tracks.log
          grep -Fq "WINDING_TRACKS_PASS:" winding-tracks.log
      - name: Physical branching shortcut and online authority regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 550 --path . --script res://tests/shortcut_routes.gd 2>&1 | tee shortcut-routes.log
          grep -Fq "SHORTCUT_ROUTES_PASS:" shortcut-routes.log
      - name: Real AI route success and 120-second fair physics race regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 100s ./Godot_v4.5.1-stable_linux.x86_64 --headless --fixed-fps 60 --quit-after 23000 --path . --script res://tests/ai_navigation.gd 2>&1 | tee ai-navigation.log
          grep -Fq "AI_NAVIGATION_PASS:" ai-navigation.log
      - name: Timed physical race events and clean-pass authority regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 550 --path . --script res://tests/race_director.gd 2>&1 | tee race-director.log
          grep -Fq "RACE_DIRECTOR_PASS:" race-director.log
      - name: Three world silhouettes, GPU motes and Android graphics quality
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 600 --path . --script res://tests/biome_signature.gd 2>&1 | tee biome-signature.log
          grep -Fq "BIOME_SIGNATURE_PASS:" biome-signature.log
      - name: Physical course identity and biome mechanics regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 540 --path . --script res://tests/course_mechanics.gd 2>&1 | tee course-mechanics.log
          grep -Fq "COURSE_MECHANICS_PASS:" course-mechanics.log
      - name: Online dead-man controls and three-course rematch regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 600 --path . --script res://tests/online_rounds.gd 2>&1 | tee online-rounds.log
          grep -Fq "ONLINE_ROUNDS_PASS:" online-rounds.log
      - name: Validate production server Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker build --file server/Dockerfile --tag marble-race-server:ci .
          docker run --rm --entrypoint python3 marble-race-server:ci -c "import asyncio, socket, signal, json; print('EDGE_RUNTIME_STD_LIB_OK')" | tee docker-runtime.log
          grep -Fq "EDGE_RUNTIME_STD_LIB_OK" docker-runtime.log
      - name: HTTP health and WebSocket gateway integration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile server/edge_gateway.py
          GODOT_BIN="$PWD/Godot_v4.5.1-stable_linux.x86_64" GAME_DIR="$PWD" GATEWAY_LOG_DIR="$RUNNER_TEMP/marble-gateway" timeout 95s bash server/test_edge_gateway.sh 2>&1 | tee gateway-test.log
          grep -Fq "EDGE_WEBSOCKET_PROXY_PASS:" gateway-test.log
      - name: Internet endpoint and timeout regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script res://tests/internet_timeout.gd 2>&1 | tee internet-timeout.log
          grep -Fq "INTERNET_TIMEOUT_PASS:" internet-timeout.log
      - name: Personal best ghost regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script res://tests/personal_ghost.gd 2>&1 | tee personal-ghost.log
          grep -Fq "PERSONAL_GHOST_PASS:" personal-ghost.log
      - name: 110-second simulated race regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s ./Godot_v4.5.1-stable_linux.x86_64 --headless --fixed-fps 60 --quit-after 7200 --path . --script res://tests/race_diagnostic.gd 2>&1 | tee race-diagnostic.log
          grep -Fq "RACE_DIAGNOSTIC_PASS" race-diagnostic.log
      - name: Four-sector split records and DNF regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 600 --path . --script res://tests/sector_timing.gd 2>&1 | tee sector-timing.log
          grep -Fq "SECTOR_TIMING_PASS:" sector-timing.log
      - name: Portable Android career copy and restore with integrity checks
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 750 --path . --script res://tests/career_transfer.gd 2>&1 | tee career-transfer.log
          grep -Fq "CAREER_TRANSFER_PASS:" career-transfer.log
      - name: Offline championship persistence
        shell: bash
        run: |
          set -euo pipefail
          timeout 75s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 300 --path . --script res://tests/career.gd 2>&1 | tee career.log
          grep -Fq "CAREER_PASS:" career.log
      - name: Long-term solo league ranks and persistent replay milestones
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 900 --path . --script res://tests/league_progress.gd 2>&1 | tee league-progress.log
          grep -Fq "LEAGUE_PROGRESS_PASS:" league-progress.log
      - name: Permanent mastery goals, unlockable marble styles and offline-only rewards
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 850 --path . --script res://tests/mastery_rewards.gd 2>&1 | tee mastery-rewards.log
          grep -Fq "MASTERY_REWARDS_PASS:" mastery-rewards.log
      - name: Career UI and locked tracks regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 75s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 300 --path . --script res://tests/ui_regression.gd 2>&1 | tee career-ui.log
          grep -Fq "UI_PASS:" career-ui.log
      - name: Three-course obstacle and finish regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s ./Godot_v4.5.1-stable_linux.x86_64 --headless --fixed-fps 60 --quit-after 46000 --path . --script res://tests/courses.gd 2>&1 | tee course-tests.log
          grep -Fq "COURSE_PASS:" course-tests.log
      - name: Full championship end-to-end simulation
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s ./Godot_v4.5.1-stable_linux.x86_64 --headless --fixed-fps 60 --quit-after 46000 --path . --script res://tests/end_to_end.gd 2>&1 | tee career-end-to-end.log
          grep -Fq "END_TO_END_PASS:" career-end-to-end.log
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK must be available on runner}"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0' 'platforms;android-35' 'platform-tools'
          mkdir -p "$HOME/.local/share/godot/keystores" "$HOME/.config/godot" build
          # Godot and hosted runners can already supply a debug key.
          # Re-running keytool with the same alias fails; be idempotent.
          if [ ! -f "$HOME/.local/share/godot/keystores/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.local/share/godot/keystores/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Open Source,C=US"
          fi
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.local/share/godot/keystores/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Generate Android debug APK
        run: ./Godot_v4.5.1-stable_linux.x86_64 --headless --path . --export-debug Android build/marble-race-debug.apk
      - name: Verify Android debug APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/marble-race-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/marble-race-debug.apk > build/apk-badging.txt
          head -n 16 build/apk-badging.txt
          test -s build/marble-race-debug.apk
      - name: Stable signing safety policy and absent-secret fallback
        shell: bash
        run: |
          set -euo pipefail
          bash -n ci/sign_android_release.sh
          policy_file="$RUNNER_TEMP/marble-signing-policy.out"
          env -u MARBLE_KEYSTORE_B64 -u MARBLE_KEY_ALIAS -u MARBLE_KEY_PASSWORD -u MARBLE_CERT_SHA256 \
            GITHUB_OUTPUT="$policy_file" bash ci/sign_android_release.sh
          grep -Fq "configured=false" "$policy_file"
          if env -u MARBLE_KEYSTORE_B64 -u MARBLE_KEY_ALIAS -u MARBLE_KEY_PASSWORD \
              MARBLE_CERT_SHA256="invalid" GITHUB_OUTPUT="$policy_file" \
              bash ci/sign_android_release.sh; then
            echo "::error::Signing allowed incomplete credentials."
            exit 1
          fi
          echo "PINNED_SIGNING_POLICY_PASS: missing secrets skip; partial secrets refuse"
      - name: Record APK identity and update-safety warning
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's|^version/name="\\(.*\\)"|\\1|p' export_presets.cfg | head -n 1)"
          code="$(sed -n 's|^version/code=\\([0-9]*\\)|\\1|p' export_presets.cfg | head -n 1)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs --verbose build/marble-race-debug.apk > "$RUNNER_TEMP/debug-apksigner.txt"
          signer="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/debug-apksigner.txt" | head -n 1)"
          test -n "$signer"
          cat > build/debug-build-identity.txt <<EOF
          Marble Race DEBUG APK
          Version: $version (code $code)
          Package: com.dbrckk.marble_race
          Signing certificate SHA-256: $signer
          Git revision: $GITHUB_SHA
          IMPORTANT: This is a TEST build. The debug signing certificate is
          generated on ephemeral GitHub runners and CAN DIFFER between runs.
          Do not uninstall the previous app to install this APK if you want
          to keep its Android private app data. Use the in-game progress
          export before any uninstall, and import it after reinstalling.
          Only APKs with the SAME package and signing certificate can update
          an existing install in place. Do not confuse this with stable builds.
          EOF
          test -s build/debug-build-identity.txt
      - name: Build stable signed Android APK when pinned signing is configured
        id: stable_apk
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          MARBLE_KEYSTORE_B64: ${{ secrets.MARBLE_ANDROID_KEYSTORE_BASE64 }}
          MARBLE_KEY_ALIAS: ${{ secrets.MARBLE_ANDROID_KEY_ALIAS }}
          MARBLE_KEY_PASSWORD: ${{ secrets.MARBLE_ANDROID_KEY_PASSWORD }}
          MARBLE_CERT_SHA256: ${{ vars.MARBLE_ANDROID_SIGNING_SHA256 }}
        run: bash ci/sign_android_release.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: marble-race-android-debug
          path: |
            build/marble-race-debug.apk
            build/debug-build-identity.txt
          retention-days: 21
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.stable_apk.outputs.configured == 'true'
        with:
          name: marble-race-android-stable-signed
          path: |
            build/marble-race-stable.apk
            build/release-update-info.txt
          retention-days: 21
          if-no-files-found: error
