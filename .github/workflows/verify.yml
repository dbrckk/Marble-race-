      - name: Three-course obstacle and finish regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s ./Godot_v4.5.1-stable_linux.x86_64 --headless --fixed-fps 60 --quit-after 46000 --path . --script res://tests/courses.gd 2>&1 | tee course-tests.log
          grep -Fq "COURSE_PASS:" course-tests.log
      - name: Full championship end-to-end simulation
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s ./Godot_v4.5.1-stable_linux.x86_64 --headless --fixed-fps 60 --quit-after 46000 --path . --script res://tests/end_to_end.gd 2>&1 | tee career-end-to-end.log
          grep -Fq "END_TO_END_PASS:" career-end-to-end.log
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK must be available on runner}"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0' 'platforms;android-35' 'platform-tools'
          mkdir -p "$HOME/.local/share/godot/keystores" "$HOME/.config/godot" build
          # Godot and hosted runners can already supply a debug key.
          # Re-running keytool with the same alias fails; be idempotent.
          if [ ! -f "$HOME/.local/share/godot/keystores/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.local/share/godot/keystores/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Open Source,C=US"
          fi
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.local/share/godot/keystores/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Generate Android debug APK
        run: ./Godot_v4.5.1-stable_linux.x86_64 --headless --path . --export-debug Android build/marble-race-debug.apk
      - name: Verify Android debug APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/marble-race-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/marble-race-debug.apk > build/apk-badging.txt
          head -n 16 build/apk-badging.txt
          test -s build/marble-race-debug.apk
      - name: Stable signing safety policy and absent-secret fallback
        shell: bash
        run: |
          set -euo pipefail
          bash -n ci/sign_android_release.sh
          policy_file="$RUNNER_TEMP/marble-signing-policy.out"
          env -u MARBLE_KEYSTORE_B64 -u MARBLE_KEY_ALIAS -u MARBLE_KEY_PASSWORD -u MARBLE_CERT_SHA256 \
            GITHUB_OUTPUT="$policy_file" bash ci/sign_android_release.sh
          grep -Fq "configured=false" "$policy_file"
          if env -u MARBLE_KEYSTORE_B64 -u MARBLE_KEY_ALIAS -u MARBLE_KEY_PASSWORD \
              MARBLE_CERT_SHA256="invalid" GITHUB_OUTPUT="$policy_file" \
              bash ci/sign_android_release.sh; then
            echo "::error::Signing allowed incomplete credentials."
            exit 1
          fi
          echo "PINNED_SIGNING_POLICY_PASS: missing secrets skip; partial secrets refuse"
      - name: Record APK identity and update-safety warning
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's|^version/name="\\(.*\\)"|\\1|p' export_presets.cfg | head -n 1)"
          code="$(sed -n 's|^version/code=\\([0-9]*\\)|\\1|p' export_presets.cfg | head -n 1)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs --verbose build/marble-race-debug.apk > "$RUNNER_TEMP/debug-apksigner.txt"
          signer="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/debug-apksigner.txt" | head -n 1)"
          test -n "$signer"
          cat > build/debug-build-identity.txt <<EOF
          Marble Race DEBUG APK
          Version: $version (code $code)
          Package: com.dbrckk.marble_race
          Signing certificate SHA-256: $signer
          Git revision: $GITHUB_SHA
          IMPORTANT: This is a TEST build. The debug signing certificate is
          generated on ephemeral GitHub runners and CAN DIFFER between runs.
          Do not uninstall the previous app to install this APK if you want
          to keep its Android private app data. Use the in-game progress
          export before any uninstall, and import it after reinstalling.
          Only APKs with the SAME package and signing certificate can update
          an existing install in place. Do not confuse this with stable builds.
          EOF
          test -s build/debug-build-identity.txt
      - name: Verify real Android release export and certificate pinning
        shell: bash
        run: bash ci/verify_release_signing.sh
      - name: Build stable signed Android APK when pinned signing is configured
        id: stable_apk
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          MARBLE_KEYSTORE_B64: ${{ secrets.MARBLE_ANDROID_KEYSTORE_BASE64 }}
          MARBLE_KEY_ALIAS: ${{ secrets.MARBLE_ANDROID_KEY_ALIAS }}
          MARBLE_KEY_PASSWORD: ${{ secrets.MARBLE_ANDROID_KEY_PASSWORD }}
          MARBLE_CERT_SHA256: ${{ vars.MARBLE_ANDROID_SIGNING_SHA256 }}
        run: bash ci/sign_android_release.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: marble-race-android-debug
          path: |
            build/marble-race-debug.apk
            build/debug-build-identity.txt
          retention-days: 21
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.stable_apk.outputs.configured == 'true'
        with:
          name: marble-race-android-stable-signed
          path: |
            build/marble-race-stable.apk
            build/release-update-info.txt
          retention-days: 21
          if-no-files-found: error
