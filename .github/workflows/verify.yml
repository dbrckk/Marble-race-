name: Verify and build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Get Godot 4.5.1 editor and Android export template
        shell: bash
        run: |
          set -euo pipefail
          VERSION=4.5.1-stable
          ROOT="https://github.com/godotengine/godot/releases/download/$VERSION"
          curl -fL --retry 3 -o godot.zip "$ROOT/Godot_v${VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v${VERSION}_linux.x86_64
          curl -fL --retry 3 -o godot.tpz "$ROOT/Godot_v${VERSION}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          unzip -q godot.tpz 'templates/android_debug.apk'
          mv templates/android_debug.apk "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK must be available on runner}"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0' 'platforms;android-35' 'platform-tools'
          mkdir -p "$HOME/.local/share/godot/keystores" "$HOME/.config/godot" build
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.local/share/godot/keystores/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Open Source,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.local/share/godot/keystores/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Import project assets
        run: ./Godot_v4.5.1-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Smoke tests
        shell: bash
        run: |
          set -euo pipefail
          # A GDScript assert can halt the test coroutine without exiting SceneTree.
          # Force a bounded run and require the actual completion marker.
          timeout 75s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 240 --path . --script res://tests/smoke.gd 2>&1 | tee smoke.log
          grep -Fq "SMOKE_PASS:" smoke.log
      - name: Multi-touch controls regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 75s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 240 --path . --script res://tests/touch_controls.gd 2>&1 | tee touch-controls.log
          grep -Fq "TOUCH_CONTROLS_PASS:" touch-controls.log
      - name: Four-race replay and hazard UI regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script res://tests/replay_variation.gd 2>&1 | tee replay-variation.log
          grep -Fq "VARIATION_AND_HAZARD_PASS:" replay-variation.log
      - name: HUD polish and particle budgets
        shell: bash
        run: |
          set -euo pipefail
          timeout 80s ./Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script res://tests/visual_polish.gd 2>&1 | tee visual-polish.log
          grep -Fq "POLISH_PASS:" visual-polish.log
      - name: Android pause and app-background regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 320 --path . --script res://tests/pause_lifecycle.gd 2>&1 | tee pause-lifecycle.log
          grep -Fq "PAUSE_LIFECYCLE_PASS:" pause-lifecycle.log
      - name: 110-second simulated race regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s ./Godot_v4.5.1-stable_linux.x86_64 --headless --fixed-fps 60 --quit-after 7200 --path . --script res://tests/race_diagnostic.gd 2>&1 | tee race-diagnostic.log
          grep -Fq "RACE_DIAGNOSTIC_PASS" race-diagnostic.log
      - name: Four-sector split records and DNF regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 600 --path . --script res://tests/sector_timing.gd 2>&1 | tee sector-timing.log
          grep -Fq "SECTOR_TIMING_PASS:" sector-timing.log
      - name: Offline championship persistence
        shell: bash
        run: |
          set -euo pipefail
          timeout 75s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 300 --path . --script res://tests/career.gd 2>&1 | tee career.log
          grep -Fq "CAREER_PASS:" career.log
      - name: Career UI and locked tracks regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 75s ./Godot_v4.5.1-stable_linux.x86_64 --headless --quit-after 300 --path . --script res://tests/ui_regression.gd 2>&1 | tee career-ui.log
          grep -Fq "UI_PASS:" career-ui.log
      - name: Three-course obstacle and finish regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s ./Godot_v4.5.1-stable_linux.x86_64 --headless --fixed-fps 60 --quit-after 46000 --path . --script res://tests/courses.gd 2>&1 | tee course-tests.log
          grep -Fq "COURSE_PASS:" course-tests.log
      - name: Full championship end-to-end simulation
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s ./Godot_v4.5.1-stable_linux.x86_64 --headless --fixed-fps 60 --quit-after 46000 --path . --script res://tests/end_to_end.gd 2>&1 | tee career-end-to-end.log
          grep -Fq "END_TO_END_PASS:" career-end-to-end.log
      - name: Generate Android debug APK
        run: ./Godot_v4.5.1-stable_linux.x86_64 --headless --path . --export-debug Android build/marble-race-debug.apk
      - name: Verify Android debug APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/marble-race-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/marble-race-debug.apk > build/apk-badging.txt
          head -n 16 build/apk-badging.txt
          test -s build/marble-race-debug.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: marble-race-android-debug
          path: build/marble-race-debug.apk
          retention-days: 21
          if-no-files-found: error
