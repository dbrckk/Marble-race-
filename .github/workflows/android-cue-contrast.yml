name: Compare live 40-marble frame pacing on Android

on:
  pull_request:
    branches: [woodworks-race-flow]
    paths:
      - .github/workflows/android-cue-contrast.yml
      - tests/android_cue_contrast_capture.gd
      - tests/android_cue_contrast_run.sh
      - tests/instrument_cue_contrast.py
      - tests/analyze_frame_pacing.py
      - scripts/hud.gd

permissions:
  contents: read

concurrency:
  group: marble-android-cue-contrast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.head_ref == 'qa/forty-marble-live-frame-pacing'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the standalone frame pacing test APK for Android
        shell: bash
        run: |
          set -euo pipefail
          version=4.5.1-stable
          root="https://github.com/godotengine/godot/releases/download/$version"
          curl -fsSL --retry 3 --retry-all-errors -o godot.zip "$root/Godot_v${version}_linux.x86_64.zip"
          curl -fsSL --retry 3 --retry-all-errors -o godot.tpz "$root/Godot_v${version}_export_templates.tpz"
          unzip -q godot.zip
          template_dir="$HOME/.local/share/godot/export_templates/4.5.1.stable"
          mkdir -p "$template_dir" "$HOME/.local/share/godot/keystores" "$HOME/.config/godot" build capture
          unzip -p godot.tpz templates/android_debug.apk > "$template_dir/android_debug.apk"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0" "platforms;android-35" "platform-tools"
          keystore="$HOME/.local/share/godot/keystores/debug.keystore"
          if [[ ! -f "$keystore" ]]; then
            keytool -genkeypair -noprompt -keystore "$keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Open Source,C=US"
          fi
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          python - <<'PY'
          from pathlib import Path

          preset = Path("export_presets.cfg")
          debug, play = preset.read_text().split("[preset.1]", 1)
          assert "architectures/x86_64=false" in debug
          debug = debug.replace("architectures/x86_64=false", "architectures/x86_64=true")
          debug = debug.replace('package/unique_name="com.dbrckk.marble_race"',
                                'package/unique_name="com.dbrckk.marble_race.livebenchmark"')
          debug = debug.replace('package/name="Marble Race: Lost Tracks"',
                                'package/name="Marble Race - Banc en course"')
          debug = debug.replace("permissions/internet=true", "permissions/internet=false")
          debug = debug.replace("[preset.0.options]",
                                '[preset.0.options]\ncommand_line/extra_args="--fixed-fps 30"')
          preset.write_text(debug + "[preset.1]" + play)

          PY
          python tests/instrument_cue_contrast.py
          godot="./Godot_v${version}_linux.x86_64"
          "$godot" --headless --editor --path . --import 2>&1 | tee capture/import.log
          if grep -Eq 'SCRIPT ERROR|Parse Error' capture/import.log; then exit 1; fi
          "$godot" --headless --path . --export-debug Android build/marble-race-qa.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify build/marble-race-qa.apk
          unzip -Z1 build/marble-race-qa.apk > capture/apk-entries.txt
          grep -Fx 'lib/x86_64/libgodot_android.so' capture/apk-entries.txt
          grep -Fx 'lib/arm64-v8a/libgodot_android.so' capture/apk-entries.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-cue-contrast-apk
          path: build/marble-race-qa.apk
          retention-days: 21

  android-rendering:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: android-cue-contrast-apk
          path: build
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm --settle
          ls -l /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Compare both revisions over live physics in Android 14 / ANGLE
        uses: ReactiveCircus/android-emulator-runner@5d6e86df22ab11632167a1a6b0c9ab0dc3469586
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2560M
          emulator-boot-timeout: 260
          emulator-options: -no-window -no-metrics -gpu swangle -no-snapshot -noaudio -no-boot-anim -camera-front none -camera-back none
          script: bash tests/android_cue_contrast_run.sh
      - name: Archive the screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-cue-contrast
          path: capture/
          retention-days: 21
          if-no-files-found: warn
