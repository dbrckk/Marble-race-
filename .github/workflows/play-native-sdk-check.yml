name: Verify pinned Play Store native SDK dependencies

on:
  push:
    paths:
      - 'ci/install_play_dependencies.sh'
      - '.github/workflows/play-native-sdk-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and verify upstream native Android plugin archives
        shell: bash
        run: |
          set -euo pipefail
          bash ci/install_play_dependencies.sh
          find addons/admob/android/bin/ads -type f | sort | head -25
          find addons/GodotGooglePlayBilling -type f | sort | head -25
          echo "PLAY_NATIVE_SDKS_PASS: pinned archives and real Android AARs"
      - name: Fetch Godot editor and Gradle Android source template
        shell: bash
        run: |
          set -euo pipefail
          version=4.5.1-stable
          base="https://github.com/godotengine/godot/releases/download/$version"
          curl -fL --retry 3 -o editor.zip "$base/Godot_v${version}_linux.x86_64.zip"
          unzip -q editor.zip
          chmod +x Godot_v${version}_linux.x86_64
          curl -fL --retry 3 -o templates.tpz "$base/Godot_v${version}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable" android/build
          unzip -q templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/android_source.zip'
          mv templates/android_debug.apk templates/android_release.apk "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          unzip -q templates/android_source.zip -d android/build
          test -f android/build/config.gradle
      - name: Set up Android SDK 36 and Godot editor paths
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          mkdir -p "$HOME/.config/godot" build
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Compile actual non-publishable Play AAB with disposable test cert
        shell: bash
        run: timeout 900s bash ci/verify_play_aab_dry_run.sh
